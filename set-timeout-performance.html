<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setTimeout Scheduling Overhead Test</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 50px;
            max-width: 600px;
        }
        .control {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 180px;
        }
        input {
            width: 100px;
            padding: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #dee2e6;
            white-space: pre-line;
        }
        #autoplay-status {
            margin-bottom: 15px;
            color: #856404;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>setTimeout Scheduling Cost Test</h1>
    <p>This page measures the execution time of the `setTimeout` function call itself (scheduling overhead).</p>
    
    <div id="autoplay-status">Detecting auto-start...</div>

    <div class="control">
        <label for="delay">Delay Parameter (ms):</label>
        <input type="number" id="delay" value="0" min="0">
    </div>
    
    <div class="control">
        <label for="iterations">Iterations (loop count):</label>
        <input type="number" id="iterations" value="10000" min="1">
    </div>
    
    <button id="runBtn">Run Test Manually</button>

    <div id="result" style="display:none;"></div>

    <script>
        let autoStartInterval = null;

        // Setup manual button trigger
        document.getElementById('runBtn').addEventListener('click', () => {
            cancelAutoStart();
            runTest();
        });

        // Auto-start logic on page load
        window.addEventListener('DOMContentLoaded', () => {
            const statusDiv = document.getElementById('autoplay-status');
            let secondsLeft = 2;
            
            statusDiv.innerText = `Test will start automatically in ${secondsLeft}s...`;
            
            autoStartInterval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft <= 0) {
                    clearInterval(autoStartInterval);
                    autoStartInterval = null;
                    statusDiv.style.backgroundColor = '#d4edda';
                    statusDiv.style.borderColor = '#c3e6cb';
                    statusDiv.style.color = '#155724';
                    statusDiv.innerText = 'Auto-test started.';
                    runTest();
                } else {
                    statusDiv.innerText = `Test will start automatically in ${secondsLeft}s...`;
                }
            }, 1000);
        });

        function cancelAutoStart() {
            if (autoStartInterval) {
                clearInterval(autoStartInterval);
                autoStartInterval = null;
                const statusDiv = document.getElementById('autoplay-status');
                statusDiv.style.backgroundColor = '#e2e3e5';
                statusDiv.style.borderColor = '#d6d8db';
                statusDiv.style.color = '#383d41';
                statusDiv.innerText = 'Auto-start cancelled. Manual mode active.';
            }
        }

        function runTest() {
            const delay = parseInt(document.getElementById('delay').value, 10);
            const iterations = parseInt(document.getElementById('iterations').value, 10);
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.innerText = 'Running test...';
            
            // Use requestAnimationFrame to ensure the UI updates "Running..." before we block the thread
            requestAnimationFrame(() => {
                // Small timeout to ensure paint has occurred
                setTimeout(() => {
                    const ids = new Array(iterations);
                    
                    console.log(`[setTimeout Overhead] Starting test with unique callback functions. Iterations: ${iterations}, Delay param: ${delay}`);
                    
                    const startTime = performance.now();
                    
                    for (let i = 0; i < iterations; i++) {
                        // Creating a new inline arrow function for each call
                        ids[i] = setTimeout(() => {}, delay);
                    }
                    
                    const endTime = performance.now();
                    const totalTime = endTime - startTime;
                    
                    // Cleanup: cancel all scheduled timeouts to prevent event loop flooding
                    for (let i = 0; i < iterations; i++) {
                        clearTimeout(ids[i]);
                    }
                    
                    const averageTimeMs = totalTime / iterations;
                    const averageTimeUs = averageTimeMs * 1000; // Microseconds
                    
                    const msg = `[setTimeout Overhead] Finished (Unique Callbacks).\n` +
                                `Total time for ${iterations} calls: ${totalTime.toFixed(4)} ms\n` +
                                `Average execution time per setTimeout call:\n` +
                                `  - ${averageTimeMs.toFixed(6)} ms\n` +
                                `  - ${averageTimeUs.toFixed(3)} µs`;
                    
                    resultDiv.innerText = msg;
                    console.log(msg);
                }, 50);
            });
        }
    </script>
</body>
</html>
